[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-incident-platform"
version = "0.1.0"
description = "AI Incident Investigation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.0,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
